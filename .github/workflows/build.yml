name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # SỬA LỖI BUILD: Google đã gỡ bỏ hẳn gói legacy "tools" khỏi kho SDK
          # (repository2-3.xml) - action này mặc định cố cài "tools platform-tools",
          # nên sdkmanager báo "Failed to find package 'tools'" và cả bước build thất
          # bại ngay từ đầu, trước khi Gradle kịp chạy. Chỉ định rõ chỉ cần
          # platform-tools - đây là fix chính thức nhiều dự án khác đang áp dụng cho
          # đúng lỗi này. Gradle/AGP sẽ tự tải build-tools/platform cần thiết khi build.
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameBoosterVN-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
